<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>WhatsApp AI Responder Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>WhatsApp AI Responder Options</h1>

    <section>
      <h2>AI provider</h2>
      <label>Provider</label>
      <select id="provider">
        <option value="groq">Groq</option>
      </select>

      <label>API key</label>
      <input id="apiKey" type="password" placeholder="gsk_..." />

      <label>Model</label>
      <div class="row">
        <select id="model"></select>
        <button id="refreshModels" type="button">Refresh models</button>
      </div>
      <p class="note" id="modelStatus">Models are loaded from Groq when an API key is available. If loading fails, the default model remains available.</p>
      <p class="note">For local testing this stores the key in Chrome local extension storage. For real use, put the key behind your own backend proxy.</p>
    </section>

    <section>
      <h2>Profiles</h2>
      <div class="row">
        <select id="profiles"></select>
        <button id="newProfile">New</button>
        <button id="deleteProfile">Delete</button>
      </div>

      <label>Name</label>
      <input id="name" />

      <label>WhatsApp chat title match substring</label>
      <input id="matchText" placeholder="Bansko Owners Renting" />

      <label>Pre-prompt</label>
      <textarea id="systemPrompt" rows="7"></textarea>

      <label>Markdown context</label>
      <textarea id="markdown" rows="14"></textarea>
    </section>

    <button id="save">Save</button>
    <div id="status"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
